# Render Blueprint - ProvenHire Backend
# See docs/DEPLOYMENT_COMPLETE.md for full setup.
#
# DATABASE_URL (critical): In Render Dashboard → Postgres → Connect → copy **External Database URL**.
# It must include the full hostname (e.g. …postgres.render.com), not only `dpg-…-a`.
# Append ?sslmode=require if not already present. Link the DB to the web service in the same region.
# Do NOT run migrate in buildCommand — builds often lack DB access; `npm start` runs migrate with retries.
services:
  - type: web
    name: provenhire-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PLACEMENT_READINESS_WEB_URL
        value: https://provenhireplacement.vercel.app
      - key: PLACEMENT_READINESS_FALLBACK_WEB_URL
        value: https://provenhireplacement.vercel.app
      - key: PLACEMENT_READINESS_CUSTOM_DOMAIN_READY
        value: "false"
      - key: PROVENHIRE_WEB_URL
        value: https://provenhire.in
      - key: PLACEMENT_HANDOFF_SHARED_SECRET
        sync: false
      - key: PLACEMENT_WEBHOOK_SECRET
        sync: false
      - key: ANTIGRAVITY_API_URL
        value: https://antigravity-backend-2oaj.onrender.com
      - key: ANTIGRAVITY_FRONTEND_URL
        value: https://antigravity-gz2r.vercel.app
      - key: ANTIGRAVITY_WEBHOOK_SECRET
        sync: false
      - key: ANTIGRAVITY_REPORT_ACCESS_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: REPORT_AGENT_MODEL
        value: google/gemini-2.5-flash
      - key: REPORT_UNIFIED_ESCALATION_MODEL
        value: google/gemini-3.1-pro-preview
      - key: REPORT_UNIFIED_ESCALATION_ENABLED
        value: "true"
      - key: REPORT_UNIFIED_ESCALATION_SCORE_SPREAD
        value: "20"
      - key: REPORT_UNIFIED_ESCALATION_CONFIDENCE_MAX
        value: "0.7"
      - key: REPORT_CRITIC_MODEL
        value: gpt-oss-120b
      - key: REPORT_CRITIC_PROVIDER
        value: cerebras

  - type: web
    name: antigravity-service
    runtime: python
    rootDir: antigravity-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: KV_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTIGRAVITY_REQUIRE_POSTGRES
        value: "1"
      - key: ANTIGRAVITY_CORS_ORIGINS
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: CARTESIA_VOICE_ID
        sync: false
      - key: OPENROUTER_SMALL_MODEL
        value: anthropic/claude-haiku-4-5
      - key: OPENROUTER_MEDIUM_MODEL
        value: anthropic/claude-sonnet-4-5
      - key: OPENROUTER_LARGE_MODEL
        value: anthropic/claude-sonnet-4-5
